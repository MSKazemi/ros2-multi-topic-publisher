name: Build and Push ROS2 Publisher Image

on:
  push:
    branches: ["main"]
  # You can also enable tag builds if you want:
  # tags:
  #   - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ros2-multi-topic-publisher:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ros2-multi-topic-publisher:${{ github.sha }}
