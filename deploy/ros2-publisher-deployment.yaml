apiVersion: apps/v1
kind: Deployment
metadata:
  name: ros2-multi-topic-publisher
  labels:
    app: ros2-multi-topic-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ros2-multi-topic-publisher
  template:
    metadata:
      labels:
        app: ros2-multi-topic-publisher
    spec:
      containers:
        - name: ros2-multi-topic-publisher
          image: ghcr.io/mskazemi/ros2-multi-topic-publisher:latest
          env:
            - name: ROS_DOMAIN_ID
              value: "0"                     # ROS2 domain ID (must match subscriber pods)
            - name: FREQUENCY_HZ
              value: "2.0"                   # publish at 2 Hz
            - name: TOPICS
              value: "/topic1,/topic2"       # comma-separated topics
            - name: PAYLOAD
              value: "hello from k8s + ROS2"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
